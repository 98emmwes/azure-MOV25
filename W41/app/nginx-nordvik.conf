# nginx-site for Nordvik felanmalan.
# Kopieras till /etc/nginx/sites-available/default av cloud-init (se infra/azuredeploy.json).
# Certifikatet (sjalvsignerat) skapas pa servern vid forsta uppstart och committas aldrig.

# All trafik pa port 80 skickas vidare till HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate     /etc/ssl/nordvik/nordvik.crt;
    ssl_certificate_key /etc/ssl/nordvik/nordvik.key;

    root /var/www/html;
    index index.html;

    # Hojer gransen sa en bild pa 2-5 MB far plats (standard ar 1 MB).
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ =404;
    }

    # STEG 3: avkommentera nar Flask-appen finns pa plats.
    # location = /submit {
    #     proxy_pass http://127.0.0.1:5000/submit;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
